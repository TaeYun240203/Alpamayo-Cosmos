paths:
  alpamayo15: null
  output_dir: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/ft
  teacher: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/teacher
  s2: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/s2/final
  r2_root: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/root
  ft_pools: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/root/_ft
  start_relabel: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/root/_ft/start_relabel.parquet
  rule_ok: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/root/rule_ok.parquet
data:
  root: /private/tmp/claude-501/-Users-taeyunkim-Library-Mobile-Documents-com-apple-CloudDocs-Workspaces-Alpamayo-Cosmos/957fe2a8-4222-4686-b2c9-aa296ca88bb2/scratchpad/ft_tiny/root
  coc_parquet: ${data.root}/_coc/coc_dataset.parquet
  collate_fn:
    _target_: morai_vla.processor.collate_fn
    _partial_: true
  train_dataset:
    _target_: morai_vla.finetune.MixtureDataset
    _recursive_: false
    passes: 2.0
    frame_stride: 5
    hist_dropout: 0.5
    seed: 0
    common:
      lidar_dropout: 0.15
      jitter:
      - 0.08
      - 0.12
      augment: true
    vla_preprocess_args:
      _target_: morai_vla.processor.get_preprocess_fn
    sources:
      new_a:
        share: 0.3
        loss: gt
        new: true
        dataset:
          root: ${paths.r2_root}
          split: train
          keep: ${paths.ft_pools}/r2_A.parquet
      new_b:
        share: 0.15
        loss: gt
        new: true
        dataset:
          root: ${paths.r2_root}
          split: train
          keep: ${paths.ft_pools}/r2_B.parquet
      new_d:
        share: 0.15
        loss: gt
        new: true
        dataset:
          root: ${paths.r2_root}
          split: train
          keep: ${paths.ft_pools}/r2_D.parquet
      old_recovery:
        share: 0.05
        loss: gt
        dataset:
          root: ${data.root}
          split: train
          keep: ${paths.ft_pools}/old_recovery.parquet
      old_curve:
        share: 0.05
        loss: gt
        dataset:
          root: ${data.root}
          split: train
          keep: ${paths.ft_pools}/old_curve.parquet
      start_relabel:
        share: 0.05
        loss: gt
        dataset:
          root: ${data.root}
          split: train
          keep: ${paths.start_relabel}
      replay:
        share: 0.25
        loss: distill
        dataset:
          root: ${data.root}
          split: train
          cell_keep:
            C0: 0.4
            C3: 0.65
            C5: 0.55
          rule_ok: ${paths.rule_ok}
  val_dataset:
    _target_: morai_vla.data.MoraiDataset
    _recursive_: false
    root: ${data.root}
    split:
    - val
    - val_asset
    coc: false
    coc_parquet: ${data.coc_parquet}
    frame_stride: 10
    max_samples: 4
    lidar_dropout: 0.0
    augment: false
    seed: 0
    vla_preprocess_args:
      _target_: morai_vla.processor.get_preprocess_fn
model:
  _target_: morai_vla.student.StudentVLA.build
  init: ${paths.s2}
  vlm_name_or_path: Qwen/Qwen3-VL-4B-Instruct
  attn_implementation: sdpa
  dtype: float32
  strict: true
  train_parts:
  - camera_vit
  - lidar
  - llm
  - lm_head
  - kd_proj
  - expert
  loss_weights:
    kv: 1.0
    vit: 10.0
    fm: 1.0
    traj_ce: 1.0
    lm: 1.0
    vkd: 0.2
    coc_kl: 0.0
  teacher: ${paths.teacher}
  teacher_vlm: Qwen/Qwen3-VL-4B-Instruct
callbacks:
  loss_components:
    _target_: morai_vla.model.LossComponentsCallback
  nonfinite_stop:
    _target_: morai_vla.guards.NonFiniteStop
  eval_fm:
    _target_: morai_vla.student.EvalComponentMetric
    key: fm
  ft_select:
    _target_: morai_vla.finetune.FtSelect
    every_steps: 4
    ref: general
    rel_worse: 0.02
    sets:
      general:
      - root: ${data.root}
        split:
        - val
        - val_asset
        frame_stride: 10
        'n': 4
      dynamic:
      - root: ${paths.r2_root}
        split:
        - val
        - val_asset
        frame_stride: 10
        keep: ${paths.ft_pools}/r2_AB.parquet
        'n': 4
      static:
      - root: ${data.root}
        split:
        - val
        - val_asset
        frame_stride: 10
        keep: ${paths.ft_pools}/old_static.parquet
        'n': 3
      curve:
      - root: ${data.root}
        split:
        - val
        - val_asset
        frame_stride: 10
        keep: ${paths.ft_pools}/old_curve.parquet
        'n': 2
      - root: ${paths.r2_root}
        split:
        - val
        - val_asset
        frame_stride: 10
        keep: ${paths.ft_pools}/r2_D.parquet
        'n': 2
    num_workers: 0
trainer:
  output_dir: ${paths.output_dir}
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-06
  warmup_steps: 4
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1.0e-06
  num_train_epochs: 1
  max_steps: 12
  logging_steps: 2
  save_strategy: 'no'
  save_steps: 1000
  save_total_limit: 1
  eval_strategy: steps
  eval_steps: 6
  bf16: false
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  dataloader_pin_memory: false
  remove_unused_columns: false
  report_to: none
  lr_multiplier:
    vlm.model.visual: 0.1
    expert: 0.3
    action_in_proj: 0.3
    action_out_proj: 0.3
  ddp_find_unused_parameters: true
  gradient_checkpointing: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  deepspeed: null
  load_best_model_at_end: false
  metric_for_best_model: eval_fm
  greater_is_better: false
  use_cpu: true
performance:
  zip_cache: false
  collate_cache: false
  tf32: true
  cudnn_benchmark: false
task_name: student_ft
resume: null
save_final: true
