# R2 fine-tune of the student WoWmayo (DATA_PLAN_R2.md 7; recipe confirmed by the user 10/27 "제안대로 가자": do not change
# the values marked "recipe" without the user). One joint stage from s2 final (BF16, before QAD), every part trains, no
# alternating freeze. Then QAD (student_qad, model.init = this run's final) -> gate -> deliver, as before (README "R2 미세조정").
# User 10/28: hard targets only ("ft와 QAD 모두 하드 타겟으로 바꿔. T* 안 쓰고"): no T* loaded, kv / vit / vkd / coc_kl off.
# Launch (cwd = train/): torchrun --nproc_per_node 8 -m morai_vla.train --config-name student_ft \
#   paths.s2=<s2 final> paths.r2_root=<R2 step-0 root> paths.start_relabel=<parquet> data.root=<step-0 root>
defaults: [student_base, ft_reset, _self_]   # ft_reset: the mixture replaces base.yaml's single train dataset

paths:
  teacher: null                            # user 10/28: no T* (student_base: ???)
  s2: ???                                  # s2 final (B2 runs/stageC/s2/final)
  r2_root: ???                             # step-0 root of the R2 collection (its own _index/index.parquet, README "R2 미세조정")
  ft_pools: assets/ft                      # scripts/ft_pools.py: old-data pools (in the repo) + R2 episode lists (after the collection)
  # start relabel of the old data (episode, i, src_i; 10 Hz rows, 54,285), confirmed by the user 10/27; in the step-0 mirror
  # (B2 step0/_start_relabel/, winpc D:/share/2026_MORAI_step0/_start_relabel/). Also the replay's exclude list.
  start_relabel: ${data.root}/_start_relabel/start_relabel_index.parquet
  # user 10/28: lane-shaped 1.5 s histories (scripts/ft_synth_hist.py: R2 D train rows, old recovery 2 Hz train rows, R2 D
  # start rows i < 15) next to the pools, shipped with the code; _ego and the index stay as they are
  synth_hist: ${paths.ft_pools}/synth_hist.parquet

model:
  init: ${paths.s2}
  # recipe: everything trains; kd_proj (the ViT KD map) only fed the T* ViT KD, frozen now that it is off
  train_parts: [camera_vit, lidar, llm, lm_head, expert]
  # user 10/28: GT only. GT rows: fm, traj_ce (no lm: the R2 data has no CoC labels); replay rows ("distill" source kind,
  # the name kept for the code path): fm, traj_ce, lm (the answer's end token: coc false, as s2)
  loss_weights: {kv: 0.0, vit: 0.0, fm: 1.0, traj_ce: 1.0, lm: 1.0, vkd: 0.0, coc_kl: 0.0}

data:
  train_dataset:
    _target_: morai_vla.finetune.MixtureDataset
    _recursive_: false
    # recipe (DATA_PLAN_R2 7 "길이", corrected 10/27): one epoch; the NEW data (A + B + D) read twice as dense as before,
    # ~4 Hz = the 2 Hz rows + per 0.5 s the row 0.2 or 0.3 s later, no sample twice; old sources from their 2 Hz rows only;
    # samples = (new ~4 Hz rows) / 0.60 (= "2 Hz rows, 2 passes")
    frame_stride: 5                        # the 2 Hz rows of the earlier stages
    epochs: 2                              # user 10/27: 2 epochs over the new dense rows (total = new rows x 2 / 0.6); cosine spans it
    extra_offsets: [2, 3]                  # grid rows (0.1 s) after each 2 Hz row: one of them per period (hash)
    hist_dropout: 0.5                      # recipe: GT rows only (~40 % of all samples), zero-displacement history tokens
    seed: 0                                # also the LiDAR dropout mask seed (= s2's): replay rows drop LiDAR exactly as in s2
    common: {lidar_dropout: 0.15, jitter: [0.08, 0.12], augment: true}
    vla_preprocess_args:
      _target_: morai_vla.processor.get_preprocess_fn
    sources:                               # recipe shares (DATA_PLAN_R2 7 "미세조정 데이터 혼합")
      new_a:                               # A dynamic obstacles (walking pedestrians, other movers, cut-in props)
        {share: 0.30, loss: gt, new: true, dataset: {root: "${paths.r2_root}", split: train, keep: "${paths.ft_pools}/r2_A.parquet"}}
      new_b:                               # B tunnel dynamic / static
        {share: 0.15, loss: gt, new: true, dataset: {root: "${paths.r2_root}", split: train, keep: "${paths.ft_pools}/r2_B.parquet"}}
      new_d:                               # D curve recovery (large lateral offsets, opposite lane, grass); user 10/28: history real /
        # zero / lane-shaped a third each (hist: thirds), + the D start rows with their lane-shaped history (synth extra rows)
        {share: 0.15, loss: gt, new: true, hist: thirds, dataset: {root: "${paths.r2_root}", split: train, keep: "${paths.ft_pools}/r2_D.parquet",
                                                                  synth: "${paths.synth_hist}"}}
      # recipe "기존 복구(R1·R2)·곡선 프레임 10 %", as two halves (scripts/ft_pools.py: curve rows outnumber recovery ~6:1)
      old_recovery:                        # off-centre rows whose GT returns to the path (after noise, spawn offsets, obstacles)
        {share: 0.05, loss: gt, hist: thirds, dataset: {root: "${data.root}", split: train, keep: "${paths.ft_pools}/old_recovery.parquet",
                                                       synth: "${paths.synth_hist}"}}
      old_curve:                           # curve rows (heading change >= 15 deg in 3 s, the curves the dense drive left)
        {share: 0.05, loss: gt, dataset: {root: "${data.root}", split: train, keep: "${paths.ft_pools}/old_curve.parquet"}}
      start_relabel:                       # old standing-at-start rows, future = the drive once the car moves
        {share: 0.05, loss: gt, dataset: {root: "${data.root}", split: train, keep: "${paths.start_relabel}"}}
      replay:                              # the s2 training rows (same cell balance), GT losses + lm (user 10/28), without the
        # start-relabelled rows (their old "wait" label must not meet the relabel on the same input; start-relabel session)
        {share: 0.25, loss: distill, dataset: {root: "${data.root}", split: train, cell_keep: {C0: 0.4, C3: 0.65, C5: 0.55},
                                               exclude: "${paths.start_relabel}"}}
  val_dataset:                             # HF eval: base.yaml's old val 512 (replay-style rows: every loss), CoC off
    coc: false                             # (base.yaml took it from the single train dataset ft_reset removed)

trainer:
  learning_rate: 3e-6                      # recipe: peak 3e-6, ~200 warmup steps, cosine to 1e-6
  warmup_steps: 200
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs: {min_lr: 1e-6}      # HF: a ratio of the base LR (1/3), so every group ends at a third of its peak
  # recipe: camera ViT 0.1x, expert 0.3-0.5x, LLM and LiDAR 1x. Expert 0.3x (README "R2 미세조정": = s2's expert peak
  # 1e-5 x 0.1, already shown stable; the new behaviours reach the expert through the student KV, which trains at 1x)
  lr_multiplier: {vlm.model.visual: 0.1, expert: 0.3, action_in_proj: 0.3, action_out_proj: 0.3}
  num_train_epochs: 1                      # the mixture IS the run (MixtureDataset: new ~4 Hz rows / new share samples)
  max_steps: -1
  load_best_model_at_end: false            # recipe: final/ = ft_select (below), not the best eval loss
  eval_steps: 500                          # loss curves on the old val (replay-style rows: eval_kv, eval_vit, eval_fm, ...)
  save_steps: 500                          # = ft_select.every_steps: the stop switch resumes from the last good measurement's checkpoint
  save_total_limit: 3                      # stop switch: keeps the checkpoint 2 measurements back

callbacks:
  ft_select:                               # recipe: every ~500 steps the 4 validation sets; final = last measurement whose
    _target_: morai_vla.finetune.FtSelect  # general ADE is not > 2 % above s2 final's (step 0), else the last one that is
    every_steps: 500
    ref: general
    rel_worse: null                        # user 10/27 21h: final = the last checkpoint (was: last within +2 % general ADE); the 4 sets are records
    stop_rel_worse: 1.0                    # user 10/28 04:1x "중단 스위치를 횡방향 ADE 기준으로 바꿔. general_wo_relabel 횡오차가 s2의
    stop_metric: lat                       #   2배(+100 %)를 2번 연속 넘으면 멈춤" (was ade +25 %, before +10 %; null = off)
    stop_patience: 2                       #   in 2 measurements in a row -> checkpoint + stop; pipeline gate_ft halts
    stop_ref: general_wo_relabel           # user 10/28: the stop switch reads general without the start-relabelled rows (old
    stop_exclude: ${paths.start_relabel}   #   "wait" GT, ~9 of the 1,000); final/ and the gate keep general
    sets:
      general:                             # = the gate / s1 early-stop set: 1,000 fixed val + val_asset rows (seed 1)
        - {root: "${data.root}", split: [val, val_asset], frame_stride: 10, n: 1000}
      dynamic:                             # R2 A + B held-out scenes (new walking pedestrians, unseen assets in val_asset)
        - {root: "${paths.r2_root}", split: [val, val_asset], frame_stride: 10, keep: "${paths.ft_pools}/r2_AB.parquet", n: 300}
      static:                              # old static-obstacle section (C2) held-out rows
        - {root: "${data.root}", split: [val, val_asset], frame_stride: 10, keep: "${paths.ft_pools}/old_static.parquet", n: 300}
      curve:                               # old curve rows + R2 D held-out scenes
        - {root: "${data.root}", split: [val, val_asset], frame_stride: 10, keep: "${paths.ft_pools}/old_curve.parquet", n: 300}
        - {root: "${paths.r2_root}", split: [val, val_asset], frame_stride: 10, keep: "${paths.ft_pools}/r2_D.parquet", n: 300}

task_name: student_ft
