# @package _global_
# Local check (RTX 5080), added to student1 / student2 with `+tiny=student`: a random-init student with the real code path
# (4B-config VLM shrunk, LiDAR ViT copy, expert transplanted from a tiny teacher checkpoint whose KV layout it shares:
# 4 layers x 2 KV heads x 64) distilled from that teacher on 20 fixed samples. The tiny teacher is the teacher's
# tiny_overfit run with coc false (README).
model:
  init: random
  attn_implementation: sdpa
  dtype: float32
  vlm_overrides:
    text_config: {hidden_size: 192, intermediate_size: 384, num_hidden_layers: 4, num_attention_heads: 4, num_key_value_heads: 2,
                  head_dim: 64, rope_scaling: {rope_type: default, mrope_section: [12, 10, 10], mrope_interleaved: true}}
    vision_config: {depth: 4, hidden_size: 96, intermediate_size: 192, num_heads: 3, out_hidden_size: 192,
                    deepstack_visual_indexes: [1, 2, 3]}

data:
  train_dataset:
    max_samples: 20
    augment: false
  val_dataset:
    max_samples: 8

trainer:
  per_device_train_batch_size: 2           # padded batches: exercises the masks (KV loss, expert)
  gradient_accumulation_steps: 1
  learning_rate: 5e-4
  warmup_steps: 20
  lr_scheduler_kwargs: {min_lr: 1e-5}
  max_steps: 1000
  logging_steps: 10
  save_steps: 1000
  eval_steps: 500
  deepspeed: null                          # winpc has no nvcc for DeepSpeed
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
